<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CATAN: New Energies</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body, #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #141820;
        color: #f0f4f8;
        font-family: "Plus Jakarta Sans", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
      }
      svg {
        display: block;
      }
      button {
        font-family: inherit;
        font-variant-numeric: tabular-nums;
        transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1),
                    background-color 160ms cubic-bezier(0.22, 1, 0.36, 1),
                    border-color 160ms cubic-bezier(0.22, 1, 0.36, 1),
                    box-shadow 160ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      button:not(:disabled):active {
        transform: scale(0.97);
      }
      @keyframes pulseTargetRing {
        0%, 100% {
          opacity: 0.92;
        }
        50% {
          opacity: 0.55;
        }
      }
      @keyframes oceanWhaleBob {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-2.2px);
        }
      }
      .ocean-whale-animated {
        animation: oceanWhaleBob 4.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      @keyframes diceTumbleTabletop {
        0% {
          opacity: 0;
          transform: translate(-36px, 28px) rotate(-140deg) scale(0.55);
        }
        45% {
          opacity: 1;
          transform: translate(6px, -10px) rotate(18deg) scale(1.12);
        }
        75% {
          transform: translate(-3px, 3px) rotate(-6deg) scale(0.98);
        }
        100% {
          opacity: 1;
          transform: translate(0, 0) rotate(0deg) scale(1);
        }
      }
      @keyframes actionBannerSlideIn {
        0% {
          opacity: 0;
          transform: translateY(-10px) scale(0.95);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .dice-tumble-anim {
        animation: diceTumbleTabletop 520ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .live-action-banner-anim {
        animation: actionBannerSlideIn 260ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
